# Codemagic — iOS build for the App Store.
#
# WHY THIS FILE LOOKS LONGER THAN A FLUTTER ONE
# A Flutter project on Codemagic has its `ios/` folder in the repository, so the
# build is «checkout → flutter build ipa». SPOT is an Expo app using Continuous
# Native Generation: there is NO `ios/` folder in git, and the Xcode project is
# generated from `app.json` on the build machine. That is deliberate — it is what
# keeps the four permission strings, the Sign in with Apple entitlement and the
# icons in ONE place instead of drifting inside a checked-in Xcode project. The
# price is three extra steps here: prebuild, pod install, and finding the
# generated workspace.
#
# ANDROID IS NOT BUILT HERE, on purpose. The Android app is built locally
# (`cd android && ./gradlew bundleRelease`) because `android/` and the upload
# keystore are not in the repository, and `google-services.json` is gitignored —
# an Android CI build would fail on the missing file. See RELEASE.md.
#
# BEFORE THE FIRST RUN — three things in the Codemagic UI, all one-time:
#   1. An App Store Connect API key must exist under Personal account settings →
#      Integrations → Developer Portal → Manage keys, and `app_store_connect`
#      below must name it EXACTLY as it is named there.
#      The key in use is `laptops_az_asc_key` — named after the first app it was
#      made for, and reused here on purpose: an ASC API key is ACCOUNT-level, not
#      app-level, so one key signs and publishes every app in the same Apple
#      team. Nothing about it is specific to that other app.
#      This is also why no Apple ID password is ever typed into a CI service.
#   2. Create the app record in App Store Connect first (bundle id
#      app.spot.az), otherwise the TestFlight upload at the end has nothing to
#      upload to. NOTE the id: iOS is `app.spot.az`, Android is `com.spot.app`.
#      They differ on purpose — see RELEASE.md.
#   3. A variable group named EXACTLY `ios_signing` on THIS app, holding
#      CERTIFICATE_PRIVATE_KEY (Secure) — the same PEM value as the CheckMate
#      app. Codemagic variables reach a codemagic.yaml build only through a
#      group named under `environment.groups`, so setting the variable without
#      the group leaves it empty and the build stops on the check below.
#      Sharing one key across both apps is what keeps them on a single
#      distribution certificate; the team's three are already spent.

workflows:
  ios-appstore:
    name: SPOT iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: laptops_az_asc_key

    environment:
      # Signing is done by the explicit script below, NOT by Codemagic's
      # declarative `ios_signing:` block. That block was tried first (build 1)
      # and failed with «No matching profiles found for bundle identifier
      # "app.spot.az" and distribution type "app_store"»: it looks a profile up
      # and does not create one, and app.spot.az had none.
      #
      # Creating the profile by hand in the portal is not a way out either. All
      # three distribution certificates on this team were created through the
      # App Store Connect API, and the portal's profile wizard does not offer
      # API-created certificates — it says «No Certificates are available» and
      # the Generate button stays disabled. What the API made, the API manages.
      #
      # CERTIFICATE_PRIVATE_KEY is the SAME PEM key the CheckMate app uses, and
      # that is the point: fetch-signing-files matches an existing certificate
      # by its private key, so both apps sign with ONE certificate instead of
      # minting one each. Apple allows three distribution certificates per team
      # and all three are already spent — without the shared key the next
      # --create gets HTTP 409 and the build has nothing to sign with.
      groups:
        - ios_signing
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      # Manual only. A push should not spend build minutes or push a build to
      # TestFlight on its own.
      events: []

    scripts:
      - name: Prepare the keychain
        script: keychain initialize

      - name: Fetch or create the signing certificate and profile
        # --create makes BOTH the App Store provisioning profile for
        # app.spot.az and, if the shared certificate were ever missing, the
        # certificate itself. With CERTIFICATE_PRIVATE_KEY set it matches the
        # certificate CheckMate already uses instead of minting a new one.
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "!! CERTIFICATE_PRIVATE_KEY is empty."
            echo "   Add it to the 'ios_signing' variable group for THIS app in"
            echo "   the Codemagic UI, using the same PEM value as CheckMate."
            echo "   Without it this build would try to create a fourth"
            echo "   distribution certificate and Apple refuses with 409 —"
            echo "   this team already has the three it is allowed."
            exit 1
          fi
          app-store-connect fetch-signing-files "app.spot.az" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add the certificate to the keychain
        script: keychain add-certificates

      - name: Install JS dependencies
        script: npm ci

      - name: Generate the native iOS project from app.json
        # `prebuild` recreates ios/ from scratch by default (--no-clean opts out),
        # so every build starts from the config, never from a stale folder.
        # --no-install skips npm and CocoaPods; both are handled explicitly.
        script: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Find the generated workspace and scheme
        # Not hardcoded: prebuild names the project after the app, and a rename
        # in app.json would otherwise break the build with a confusing error.
        script: |
          set -e
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          echo "XCODE_WORKSPACE=$WS"  >> $CM_ENV
          echo "XCODE_SCHEME=$SCHEME" >> $CM_ENV

      - name: Set the build number
        # Apple refuses a build whose CFBundleVersion is not higher than the last
        # one uploaded. $BUILD_NUMBER is Codemagic's own counter and only goes up.
        script: cd ios && agvtool new-version -all $BUILD_NUMBER

      - name: Apply the provisioning profiles
        script: xcode-project use-profiles

      - name: Build the IPA
        script: >
          xcode-project build-ipa
          --workspace "$XCODE_WORKSPACE"
          --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Releasing to the store stays a manual decision
        # in App Store Connect — a CI job should not publish to the public.
        submit_to_testflight: true
        submit_to_app_store: false
